name: Generate Dashboard Screenshot

on:
  schedule:
    - cron: '*/2 * * * *'  # 每 5 分鐘自動執行一次
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 🔑 關鍵步驟：安裝繁體中文字體 (Noto Sans CJK TC)
      - name: Install Asian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({ args: ["--no-sandbox", "--disable-setuid-sandbox"] });
            const page = await browser.newPage();
            await page.setViewport({ width: 800, height: 480 });
            await page.goto("https://simonpoon-dot.github.io/index.html", { waitUntil: "networkidle0" });
            await new Promise(r => setTimeout(r, 6000)); // 等待 6 秒確保 API 載入
            await page.screenshot({ path: "dashboard.png" });
            await browser.close();
          })();
          '

      - name: Commit and push screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Auto-update dashboard screenshot with fonts" || exit 0
          git push
