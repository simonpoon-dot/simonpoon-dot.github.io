name: Generate Dashboard Screenshot

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘自動截圖一次
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write          # 關鍵：給予 Actions 寫入檔案並 Push 的權限

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({ args: ["--no-sandbox", "--disable-setuid-sandbox"] });
            const page = await browser.newPage();
            await page.setViewport({ width: 800, height: 480 });
            await page.goto("https://simonpoon-dot.github.io/index.html", { waitUntil: "networkidle0" });
            
            // 使用相容性最好的 setTimeout 等待 6 秒，確保巴士與 Google 日曆 API 載入完成
            await new Promise(r => setTimeout(r, 6000));
            
            await page.screenshot({ path: "dashboard.png" });
            await browser.close();
          })();
          '

      - name: Commit and push screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Auto-update dashboard screenshot" || exit 0
          git push
