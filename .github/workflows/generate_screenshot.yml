name: Generate Dashboard Screenshot

on:
  schedule:
    # 同時設定多個時間點，迫使 GitHub 的伺服器排隊佇列維持活躍
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Asian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({ args: ["--no-sandbox", "--disable-setuid-sandbox"] });
            const page = await browser.newPage();
            await page.setViewport({ width: 800, height: 480 });
            // 帶入動態時間戳，確保 Puppeteer 每次抓取的都是最新 index.html
            await page.goto("https://simonpoon-dot.github.io/index.html?t=" + Date.now(), { waitUntil: "networkidle0" });
            await new Promise(r => setTimeout(r, 6000));
            await page.screenshot({ path: "dashboard.png" });
            await browser.close();
          })();
          '

      - name: Commit and push screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.png
          # 加上時間戳 Commit，讓 GitHub 知道這個 Repo 一直有新動態，永遠不會被停用
          git commit -m "Auto-update dashboard screenshot [$(date +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
