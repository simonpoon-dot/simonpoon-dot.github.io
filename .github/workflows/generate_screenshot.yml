name: Generate Dashboard Screenshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Asian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        env:
          TZ: 'Asia/Hong_Kong'
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({ args: ["--no-sandbox", "--disable-setuid-sandbox"] });
            const page = await browser.newPage();
            await page.emulateTimezone("Asia/Hong_Kong");
            await page.setViewport({ width: 800, height: 480 });
            await page.goto("https://simonpoon-dot.github.io/index.html?t=" + Date.now(), { waitUntil: "networkidle0" });
            await page.waitForFunction(() => window.IS_LOADED === true, { timeout: 15000 }).catch(() => {});
            await new Promise(r => setTimeout(r, 2000));
            await page.screenshot({ path: "dashboard.png" });
            await browser.close();
          })();
          '

      - name: Force Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard.png
          git commit -m "Auto-update screenshot [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes"
          git push origin main
