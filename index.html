<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <!-- 鎖定解析度為 E1001 的 800x480 -->
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0">
  <title>香港巴士到站時間</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 800px;
      height: 480px;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      overflow: hidden;
    }
    
    /* 頁首：路線與車站名稱 */
    .header {
      border-bottom: 4px solid #000000;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .route-info {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .route-number {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
    }
    .destination {
      font-size: 28px;
      font-weight: 700;
    }
    .stop-name {
      font-size: 22px;
      color: #333333;
    }

    /* 班次列表 */
    .eta-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .eta-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 3px solid #000000;
      padding: 16px 24px;
      border-radius: 8px;
    }
    .eta-card.first {
      background-color: #000000;
      color: #ffffff;
    }
    .eta-index {
      font-size: 24px;
      font-weight: bold;
    }
    .eta-time {
      font-size: 42px;
      font-weight: 900;
    }
    .eta-countdown {
      font-size: 32px;
      font-weight: bold;
    }

    /* 狀態與更新時間 */
    .footer {
      position: absolute;
      bottom: 16px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: #555555;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="route-info">
      <!-- 路線號碼 -->
      <div class="route-number" id="route-num">1A</div>
      <!-- 目的地 -->
      <div class="destination" id="dest-name">往 尖沙咀碼頭</div>
    </div>
    <!-- 站名 -->
    <div class="stop-name" id="stop-name">載入中...</div>
  </div>

  <div class="eta-list" id="eta-container">
    <div class="eta-card">
      <span class="eta-index">正在獲取巴士實時數據...</span>
    </div>
  </div>

  <div class="footer">
    <span id="status-text">狀態：運作正常</span>
    <span id="last-updated">最後更新：--:--:--</span>
  </div>

  <script>
    // ==========================================
    // ⚙️ 設定區：請在這裡修改您的車站與路線資料
    // ==========================================
    // 您可以用這個 API 查詢路線的站號 id：
    // https://data.etabus.gov.hk/v1/transport/kmb/route-stop/1A/outbound/1
    const CONFIG = {
      route: "1A",             // 巴士路線號碼
      dir: "outbound",         // 方向：outbound (去程) 或 inbound (回程)
      serviceType: "1",        // 服務類型：通常為 1 (正常班次)
      stopId: "A3FE752B3C5DFD0E", // 九巴車站 ID (範例為某站點)
      stopName: "太子站",      // 自訂顯示的車站名稱
      refreshInterval: 30000   // 自動更新頻率 (毫秒)，預設 30 秒
    };

    // 設定頁面靜態文字
    document.getElementById("route-num").textContent = CONFIG.route;
    document.getElementById("stop-name").textContent = CONFIG.stopName;

    async function fetchETA() {
      const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${CONFIG.stopId}/${CONFIG.route}/${CONFIG.serviceType}`;
      const container = document.getElementById("eta-container");
      
      try {
        const response = await fetch(url);
        const json = await response.json();
        
        // 篩選與路線方向相符的班次
        const now = new Date();
        const etas = json.data
          .filter(item => item.dir === (CONFIG.dir === 'outbound' ? 'O' : 'I') && item.eta)
          .slice(0, 3); // 取前 3 班車

        if (etas.length === 0) {
          container.innerHTML = `
            <div class="eta-card">
              <span class="eta-index">目前沒有即將到達的班次</span>
            </div>`;
          return;
        }

        // 更新目的地名稱 (取第一班車的目的地)
        document.getElementById("dest-name").textContent = "往 " + (etas[0].dest_tc || "");

        // 渲染班次列表
        container.innerHTML = etas.map((item, index) => {
          const etaTime = new Date(item.eta);
          const diffMinutes = Math.max(0, Math.round((etaTime - now) / 60000));
          
          const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
          const countdownStr = diffMinutes === 0 ? "即將到達" : `${diffMinutes} 分鐘`;
          const isFirst = index === 0;

          return `
            <div class="eta-card ${isFirst ? 'first' : ''}">
              <span class="eta-index">下 ${index + 1} 班</span>
              <span class="eta-time">${timeStr}</span>
              <span class="eta-countdown">${countdownStr}</span>
            </div>
          `;
        }).join('');

        document.getElementById("status-text").textContent = "狀態：數據已更新";
      } catch (error) {
        console.error("Fetch ETA Error:", error);
        document.getElementById("status-text").textContent = "狀態：連線失敗，等待重試";
      } finally {
        const timeNow = new Date().toLocaleTimeString('zh-HK', { hour12: false });
        document.getElementById("last-updated").textContent = `最後更新：${timeNow}`;
      }
    }

    // 初始化與定時器
    fetchETA();
    setInterval(fetchETA, CONFIG.refreshInterval);
  </script>
</body>
</html>
