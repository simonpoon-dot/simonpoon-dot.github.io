<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0">
  <title>資訊看板 (帶圖標天氣警告版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 800px;
      height: 480px;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 8px;
      display: flex;
      gap: 8px;
      overflow: hidden;
    }

    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ---------------- 左側：巴士 + 自訂日曆 (410px) ---------------- */
    .left-panel {
      width: 410px;
      border-right: 2px dashed #000000;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 900;
      border-bottom: 3px solid #000000;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }

    /* 巴士區域 */
    .routes-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .route-card {
      border: 2px solid #000000;
      border-radius: 5px;
      padding: 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .route-info {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 175px;
    }
    .route-badge {
      background-color: #000000;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      min-width: 58px;
      text-align: center;
    }
    .destination {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.1;
    }
    .stop-name {
      font-size: 11px;
      color: #333;
    }
    .eta-times {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .eta-box {
      text-align: right;
      min-width: 62px;
    }
    .eta-time {
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }
    .eta-countdown {
      font-size: 13px;
      font-weight: bold;
    }

    /* 行程清單區域 */
    .calendar-container {
      flex: 1;
      border: 2px solid #000000;
      border-radius: 5px;
      padding: 4px 6px;
      background-color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #000;
      padding-bottom: 2px;
    }
    .event-date {
      font-size: 12px;
      font-weight: 900;
      background-color: #000000;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .event-title {
      font-size: 14px;
      font-weight: 800;
      flex: 1;
      margin-left: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------- 右側：天氣 + 告示欄 (360px) ---------------- */
    .right-panel {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 🚨 帶 ICON 的天氣警告橫幅 */
    .warning-box {
      display: none;
      background-color: #000000;
      color: #ffffff;
      border-radius: 5px;
      padding: 4px 8px;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .warning-box.active {
      display: flex;
    }
    .warning-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .warning-icon-svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .warning-content {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .warning-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .warning-badge {
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* 天氣預報 */
    .weather-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .weather-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #000000;
      padding-bottom: 2px;
    }
    .weather-date {
      font-size: 14px;
      font-weight: bold;
      width: 85px;
    }
    .weather-svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .weather-temp {
      font-size: 15px;
      font-weight: 900;
      width: 105px;
      text-align: center;
    }
    .weather-rh {
      font-size: 12px;
      color: #222;
      width: 60px;
      text-align: right;
    }

    /* 右下告示欄 */
    .memo-container {
      flex: 1;
      border: 2px solid #000000;
      border-radius: 5px;
      padding: 6px 8px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .memo-content {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
      color: #000000;
      white-space: pre-line;
    }

    .footer {
      font-size: 11px;
      color: #333333;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #aaa;
      padding-top: 2px;
    }
  </style>
</head>
<body>

  <!-- 左區：巴士 ETA + 行程看板 -->
  <div class="panel left-panel">
    <div>
      <div class="panel-title">🚌 巴士實時到站</div>
      <div class="routes-container" id="routes-container">
        <div style="font-size: 14px;">載入巴士數據中...</div>
      </div>
    </div>

    <!-- 自訂 iCal 近期行程區域 -->
    <div style="display: flex; flex-direction: column; flex: 1; margin-top: 2px; overflow: hidden;">
      <div class="panel-title">📅 近期行程</div>
      <div class="calendar-container" id="ical-container">
        <div style="font-size: 14px;">載入行程數據中...</div>
      </div>
    </div>

    <div class="footer">
      <span id="bus-status">更新中...</span>
      <span id="bus-updated">--:--</span>
    </div>
  </div>

  <!-- 右區：天氣預報 + 告示欄 -->
  <div class="panel right-panel">
    <div>
      <div class="panel-title">🌤️ 天文台預報</div>

      <!-- 🚨 警告欄（含圖標） -->
      <div class="warning-box" id="warning-box">
        <div class="warning-icon-wrapper" id="warning-icon"></div>
        <div class="warning-content">
          <div class="warning-title" id="warning-text">警告訊息</div>
          <div class="warning-badge">生效中</div>
        </div>
      </div>

      <div class="weather-list" id="weather-container">
        <div style="font-size: 14px;">載入天氣數據...</div>
      </div>
    </div>

    <!-- 📌 右下方告示欄 -->
    <div style="display: flex; flex-direction: column; flex: 1; margin-top: 2px;">
      <div class="panel-title">📌 每日告示 / 備忘</div>
      <div class="memo-container">
        <div class="memo-content" id="memo-text">
1. 記得帶雨傘 ☔
2. 買牛奶 & 雞蛋 🥛
3. 晚上倒垃圾 🗑️
        </div>
      </div>
    </div>

    <div class="footer">
      <span>數據源：香港天文台</span>
      <span id="weather-updated">--:--</span>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 設定區
    // ==========================================
    let ICAL_URL = "https://script.google.com/macros/s/AKfycbwEVrya_PomGtmFNnh-l_G__ZreB8BfN1GkVYKhWBX-4F46f_UAXLuNeYD6dSaLFQt9/exec";

    const ROUTES = [
      {
        company: "kmb",
        route: "286C",
        dir: "outbound",
        serviceType: "1",
        stopId: "042BAE34F58C8D01",
        stopName: "富昌邨",
        defaultDest: "利安"
      },
      {
        company: "kmb",
        route: "296C",
        dir: "outbound",
        serviceType: "1",
        stopId: "5527FF8CC85CF139",
        stopName: "興華西街(海盈邨)",
        defaultDest: "尚德"
      },
      {
        company: "ctb",
        route: "701A",
        stopId: "003545",
        stopName: "海盈邨",
        defaultDest: "旺角"
      },
      {
        company: "ctb",
        route: "702B",
        stopId: "003545",
        stopName: "海盈邨",
        defaultDest: "白田北"
      }
    ];

    async function fetchWithFallback(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {}

      try {
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const resProxy = await fetch(proxyUrl);
        if (resProxy.ok) return await resProxy.json();
      } catch (e) {}

      return null;
    }

    async function fetchSingleETA(item) {
      let url = item.company === "ctb" 
        ? `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${item.stopId}/${item.route}`
        : `https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stopId}/${item.route}/${item.serviceType || 1}`;

      try {
        const json = await fetchWithFallback(url);
        const now = new Date();
        
        let etas = [];
        if (json && json.data) {
          etas = item.company === "ctb"
            ? json.data.filter(dataItem => dataItem.eta).slice(0, 2)
            : json.data.filter(dataItem => dataItem.dir === (item.dir === 'outbound' ? 'O' : 'I') && dataItem.eta).slice(0, 2);
        }

        let destName = item.defaultDest ? "往 " + item.defaultDest : "巴士路線";
        if (etas.length > 0 && etas[0].dest_tc) {
          destName = "往 " + etas[0].dest_tc;
        }

        let etaHtml = "";
        if (etas.length === 0) {
          etaHtml = `<div style="font-size: 13px; font-weight: bold; color: #555;">未有班次</div>`;
        } else {
          etaHtml = etas.map(etaItem => {
            const etaTime = new Date(etaItem.eta);
            const diffMinutes = Math.max(0, Math.round((etaTime - now) / 60000));
            const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
            return `<div class="eta-box"><div class="eta-time">${timeStr}</div><div class="eta-countdown">${diffMinutes === 0 ? "到站" : diffMinutes + "分"}</div></div>`;
          }).join('');
        }

        return `
          <div class="route-card">
            <div class="route-info">
              <div class="route-badge">${item.route}</div>
              <div><div class="destination">${destName}</div><div class="stop-name">${item.stopName}</div></div>
            </div>
            <div class="eta-times">${etaHtml}</div>
          </div>
        `;
      } catch (error) {
        return `
          <div class="route-card">
            <div class="route-info">
              <div class="route-badge">${item.route}</div>
              <div><div class="destination">往 ${item.defaultDest || '目的地'}</div><div class="stop-name">${item.stopName}</div></div>
            </div>
            <div class="eta-times"><div style="font-size: 12px; color: #666;">訊號更新中</div></div>
          </div>
        `;
      }
    }

    async function updateBusETAs() {
      const container = document.getElementById("routes-container");
      const htmlResults = await Promise.all(ROUTES.map(item => fetchSingleETA(item)));
      container.innerHTML = htmlResults.join('');
      document.getElementById("bus-updated").textContent = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById("bus-status").textContent = "正常";
    }

    // ==========================================
    // 📅 行程數據讀取 (支援 Apps Script 與代理 iCal)
    // ==========================================
    async function fetchAndParseICal() {
      const container = document.getElementById("ical-container");
      if (!ICAL_URL) {
        container.innerHTML = `<div style="font-size: 13px; color:#555;">請設定 ICAL_URL</div>`;
        return;
      }

      // 情況 1: 使用 Google Apps Script 的 Web App 網址
      if (ICAL_URL.includes("script.google.com")) {
        try {
          const res = await fetch(ICAL_URL);
          if (!res.ok) throw new Error("Network response was not ok");
          const events = await res.json();

          if (!events || events.length === 0) {
            container.innerHTML = `<div style="font-size: 13px;">近期無預錄行程</div>`;
            return;
          }

          events.sort((a, b) => a.rawDate.localeCompare(b.rawDate));

          container.innerHTML = events.slice(0, 4).map(ev => `
            <div class="event-item">
              <div class="event-date">${ev.dateStr}</div>
              <div class="event-title">${ev.summary}</div>
            </div>
          `).join('');
          return;
        } catch (e) {
          console.error("Apps Script fetch error:", e);
          container.innerHTML = `<div style="font-size: 12px; color:#333;">行程載入失敗<br>(請確認 Apps Script 權限設為「所有人」)</div>`;
          return;
        }
      }

      // 情況 2: 使用傳統 .ics 網址備用
      let cleanUrl = ICAL_URL.trim().replace("webcal://", "https://");
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(cleanUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(cleanUrl)}`
      ];

      let text = null;
      for (let proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            text = await res.text();
            if (text && text.includes("BEGIN:VCALENDAR")) break;
          }
        } catch (e) {}
      }

      if (!text) {
        container.innerHTML = `<div style="font-size: 12px; color:#333;">行程載入失敗<br>(請確認日曆已公開)</div>`;
        return;
      }

      const events = parseICS(text);
      if (events.length === 0) {
        container.innerHTML = `<div style="font-size: 13px;">近期無預錄行程</div>`;
        return;
      }

      container.innerHTML = events.slice(0, 4).map(ev => `
        <div class="event-item">
          <div class="event-date">${ev.dateStr}</div>
          <div class="event-title">${ev.summary}</div>
        </div>
      `).join('');
    }

    function parseICS(icsData) {
      const lines = icsData.split(/\r\n|\n|\r/);
      const events = [];
      let currentEvent = null;

      for (let line of lines) {
        if (line.startsWith("BEGIN:VEVENT")) {
          currentEvent = {};
        } else if (line.startsWith("END:VEVENT")) {
          if (currentEvent && currentEvent.dtstart && currentEvent.summary) {
            events.push(currentEvent);
          }
          currentEvent = null;
        } else if (currentEvent) {
          if (line.startsWith("SUMMARY:")) {
            currentEvent.summary = line.replace("SUMMARY:", "").trim();
          } else if (line.startsWith("DTSTART")) {
            const parts = line.split(":");
            const dateVal = parts[parts.length - 1];
            if (dateVal && dateVal.length >= 8) {
              const y = dateVal.substring(0, 4);
              const m = dateVal.substring(4, 6);
              const d = dateVal.substring(6, 8);
              currentEvent.dtstart = `${y}-${m}-${d}`;
              currentEvent.rawDate = `${y}-${m}-${d}`;
              currentEvent.dateStr = `${m}/${d}`;
            }
          }
        }
      }

      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      
      return events
        .filter(ev => ev.rawDate >= today)
        .sort((a, b) => a.rawDate.localeCompare(b.rawDate));
    }

    // ==========================================
    // 🌤️ 天氣預報 & 🚨 實時天氣警告
    // ==========================================
    const SVG_ICONS = {
      sun: `<svg class="weather-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
      cloud: `<svg class="weather-svg" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
      sunCloud: `<svg class="weather-svg" viewBox="0 0 24 24"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41"/><path d="M15.9 11.1a5 5 0 0 0-8.8 3.4h0a4 4 0 0 0 2.2 7.5h7.7a3.5 3.5 0 0 0 0-7c-.3 0-.6.1-.9.2z"/></svg>`,
      rain: `<svg class="weather-svg" viewBox="0 0 24 24"><path d="M16 13v8M8 13v8M12 15v8"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
      thunder: `<svg class="weather-svg" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 3 16.3"/><path d="M13 11l-4 6h6l-4 6"/></svg>`
    };

    const WARNING_ICONS = {
      typhoon: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M12 9c4.7 0 8-3.5 8-8c-4.7 0-8 3.5-8 8z"/><path d="M12 15c-4.7 0-8 3.5-8 8c4.7 0 8-3.5 8-8z"/></svg>`,
      rain: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M16 13v6M8 13v6M12 15v6"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
      thunder: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
      hot: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M12 9v3m0 4h.01M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><circle cx="12" cy="12" r="4"/></svg>`,
      cold: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/></svg>`,
      generic: `<svg class="warning-icon-svg" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
    };

    function getSVGIcon(code) {
      code = Number(code);
      if ([50, 51, 52].includes(code)) return SVG_ICONS.sun;
      if ([60, 61].includes(code)) return SVG_ICONS.sunCloud;
      if ([62, 63, 64, 65].includes(code)) return SVG_ICONS.cloud;
      if ([80, 81, 82, 83, 84, 85].includes(code)) return SVG_ICONS.thunder;
      return SVG_ICONS.rain;
    }

    function getWarningIcon(text) {
      if (text.includes("風球") || text.includes("颱風") || text.includes("旋風") || text.includes("信號")) {
        return WARNING_ICONS.typhoon;
      }
      if (text.includes("雨") || text.includes("暴雨")) {
        return WARNING_ICONS.rain;
      }
      if (text.includes("雷暴")) {
        return WARNING_ICONS.thunder;
      }
      if (text.includes("酷熱")) {
        return WARNING_ICONS.hot;
      }
      if (text.includes("寒冷")) {
        return WARNING_ICONS.cold;
      }
      return WARNING_ICONS.generic;
    }

    async function fetchHKOWarnings() {
      const url = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
      const warningBox = document.getElementById("warning-box");
      const warningText = document.getElementById("warning-text");
      const warningIcon = document.getElementById("warning-icon");

      try {
        const data = await fetchWithFallback(url);
        if (data && data.warningMessage && data.warningMessage.length > 0) {
          let primaryWarning = data.warningMessage[0];
          primaryWarning = primaryWarning.replace("現正生效", "").replace("發出", "");

          warningIcon.innerHTML = getWarningIcon(primaryWarning);
          warningText.textContent = primaryWarning;
          warningBox.classList.add("active");
        } else {
          warningBox.classList.remove("active");
        }
      } catch (e) {
        warningBox.classList.remove("active");
      }
    }

    async function fetchHKOWeather() {
      const url = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc";
      const container = document.getElementById("weather-container");
      try {
        const data = await fetchWithFallback(url);
        if (data && data.weatherForecast) {
          const forecastList = data.weatherForecast.slice(0, 6);

          container.innerHTML = forecastList.map(item => {
            const month = item.forecastDate.substring(4, 6);
            const day = item.forecastDate.substring(6, 8);
            const weekDay = item.week.replace("星期", "");
            const dateStr = `${month}/${day} (${weekDay})`;
            const svgIconHtml = getSVGIcon(item.ForecastIcon);
            return `
              <div class="weather-row">
                <div class="weather-date">${dateStr}</div>
                ${svgIconHtml}
                <div class="weather-temp">${item.forecastMintemp.value}° - ${item.forecastMaxtemp.value}°C</div>
                <div class="weather-rh">${item.forecastMinrh.value}-${item.forecastMaxrh.value}%</div>
              </div>
            `;
          }).join('');
          document.getElementById("weather-updated").textContent = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
        } else {
          throw new Error("Invalid format");
        }
      } catch (error) {
        container.innerHTML = `<div style="font-size: 12px;">天氣數據獲取失敗</div>`;
      }
    }

    // 初始化與定時更新
    updateBusETAs();
    fetchHKOWarnings();
    fetchHKOWeather();
    fetchAndParseICal();

    setInterval(updateBusETAs, 30000);
    setInterval(fetchHKOWarnings, 300000);
    setInterval(fetchHKOWeather, 1800000);
    setInterval(fetchAndParseICal, 1800000);
  </script>
</body>
</html>
